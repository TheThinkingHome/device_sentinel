[pytest]
asyncio_mode = auto
# Run this suite serially. It is not xdist-safe: the pinned harness
# (pytest-homeassistant-custom-component) serves one shared
# testing_config/www/ directory from site-packages to every worker,
# so under `-n N` two workers race the daily brief's atomic write
# (daily_brief.html.tmp -> daily_brief.html) and one loses the
# rename intermittently. That is a property of the shared harness
# directory, not of the report writer, which on a live system has
# exactly one writer and for which the .tmp-then-rename is correct.
# Do not pass -n; the proof gate is serial.
