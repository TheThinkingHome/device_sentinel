# File: .github/workflows/lint.yml, Version: 0.29.8 (2026-11-20)
name: Lint

# A rule nobody checks is not a rule. The tests, hassfest and HACS
# validation all pass with a dead import in place, so this job looks:
# dead imports, unused variables and unsafe names turn the build red
# the way a failing test does.


# Least privilege: these jobs only read the checked-out code, so
# the token is held to read-only. CodeQL flags a workflow with no
# permissions block because it inherits the repository default,
# which can be broader than the work requires.
permissions:
  contents: read

on:
  push:
  pull_request:

# One run per branch: a new commit cancels the runs of the one before
# it. An upload through the GitHub page is one commit per batch of
# files, and only the last commit holds the whole release, so the runs
# for the others only queued it behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.6"
      # Pinned rather than floating: a linter that changes its mind on
      # its own schedule turns an unrelated push red for reasons the
      # author did not cause and cannot see in their own diff.
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Lint the integration and its tests
        run: ruff check custom_components/ tests/
