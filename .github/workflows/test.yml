name: Tests


# Least privilege: these jobs only read the checked-out code, so
# the token is held to read-only. CodeQL flags a workflow with no
# permissions block because it inherits the repository default,
# which can be broader than the work requires.
permissions:
  contents: read

on:
  push:
  pull_request:
  # A manual trigger, so a run can be started from the Actions tab
  # without an empty commit. Added after a day of uploads produced no
  # runs at all and there was no way to tell a workflow that failed
  # from one that never fired.
  workflow_dispatch:

jobs:
  pytest:
    # Three harnesses: the minimum hacs.json declares, until it reaches
    # 2026.8.0; the release the fleets run; and the newest release. A test that passes on only one of them proves only
    # half the range a user can install on.
    name: Tests (Home Assistant ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.5.0"
            requirements: requirements_test_floor.txt
          - home-assistant: "2026.10.4"
            requirements: requirements_test.txt
          # Home Assistant 2026.11 ships its own harness, installed from
          # the release's source until it is on PyPI (rule REL-03).
          - home-assistant: "2026.11.0"
            requirements: requirements_test_next.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Install test harness
        run: pip install -r ${{ matrix.requirements }}
      # A test that hangs fails by name after two minutes rather than
      # holding the job until GitHub's own six-hour limit.
      - name: Run the suite
        run: python -m pytest tests/ -q --timeout=120
