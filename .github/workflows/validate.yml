# Device Sentinel - a Home Assistant custom integration from The Thinking Home (xeazy.com)
#   Article: https://xeazy.com/reliable-home-assistant-dead-sensor-detection/
#   Repository: https://github.com/TheThinkingHome/device_sentinel
# File: .github/workflows/validate.yml, Version: 0.28.11 (2026-11-10)
name: Validate


# Least privilege: these jobs only read the checked-out code, so
# the token is held to read-only. CodeQL flags a workflow with no
# permissions block because it inherits the repository default,
# which can be broader than the work requires.
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

# One run per branch: a new commit cancels the runs of the one before
# it. An upload through the GitHub page is one commit per batch of
# files, and only the last commit holds the whole release, so the runs
# for the others only queued it behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest (Home Assistant's own manifest checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than a branch. A branch reference
      # runs whatever that branch holds at the moment the job starts,
      # so whoever controls it controls what runs here. Dependabot
      # raises a pull request when either action moves, which keeps
      # the checks current without the reference being open-ended.
      # home-assistant/actions master, 2026-08-03.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # hacs/action main, 2026-06-08. Tags on this action stopped at
      # 22.5.0, so the maintained line is the branch and a commit is
      # the only fixed point available.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
